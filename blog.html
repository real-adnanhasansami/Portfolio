<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>body{visibility:hidden;}</style>
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="page-header">
    <div class="container">
      <span class="eyebrow">Blog</span>
      <h1>Notes &amp; writing</h1>
    </div>
  </div>

  <section class="section">
    <div class="container">
      <div class="blog-grid" id="blogGrid"></div>
    </div>
  </section>

  <!-- =====================================================================
       NEWSLETTER SUBSCRIBE BOX
       ===================================================================== -->
  <section class="section section--tight section--alt">
    <div class="container">
      <div class="subscribe-box">
        <div>
          <h3>Get new posts by email</h3>
          <p>No spam — just new posts when they come out.</p>
        </div>
        <form class="subscribe-form" id="subscribeForm">
          <input type="email" id="subscribe-email" placeholder="you@email.com" required />
          <button type="submit" class="btn btn--primary">Subscribe</button>
        </form>
      </div>
      <p class="form-status" id="subscribeStatus"></p>
    </div>
  </section>

  <div id="customBlocks" data-page-slug="blog"></div>

</main>

<div id="site-footer"></div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/common.js"></script>
<script type="module" src="js/content-loader.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
