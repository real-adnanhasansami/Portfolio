<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">

<!-- =====================================================================
     LOGIN SCREEN
     ===================================================================== -->
<div class="admin-login" id="loginScreen">
  <h1>Site Admin</h1>
  <p style="color:var(--color-ink-soft); font-size:0.9rem;">Sign in to edit your website content.</p>
  <form class="admin-form" id="loginForm" style="border:none; padding:0; margin:0;">
    <div class="field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" required />
    </div>
    <div class="field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required />
    </div>
    <button type="submit" class="btn btn--primary">Sign in</button>
    <p class="form-status" id="loginStatus"></p>
  </form>
</div>

<!-- =====================================================================
     ADMIN DASHBOARD
     The tabs (#adminTabs) and panels (#adminPanels) below are EMPTY on
     purpose — js/admin.js fills them in based on js/admin-schema.js.
     Add a new section by editing admin-schema.js, not this file.
     ===================================================================== -->
<div class="admin-shell" id="adminShell">

  <div class="admin-topbar">
    <div class="container">
      <strong>Site Admin</strong>
      <button class="btn btn--outline" id="logoutBtn" style="border-color:#fff; color:#fff;">Sign out</button>
    </div>
  </div>

  <div class="container">
    <div class="admin-tabs" id="adminTabs"></div>
    <div id="adminPanels"></div>
  </div>
</div>

<script type="module" src="js/firebase-config.js"></script>
<script type="module" src="js/admin.js"></script>
<script type="module" src="js/admin-blocks.js"></script>

</body>
</html>
